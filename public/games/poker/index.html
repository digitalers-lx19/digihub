<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker | DigiHub</title>
    <link rel="stylesheet" href="/cards/styles.css">
</head>
<body>
    <header>
        <a href="/">← DigiHub</a>
        <h1>Poker</h1>
        <span>Sala: <strong id="roomLabel">—</strong></span>
    </header>
    <section class="lobby">
        <input id="roomInput" placeholder="Código de sala" />
        <input id="nameInput" placeholder="Tu nombre" />
        <button id="joinBtn">Entrar</button>
        <button id="startBtn" disabled>Repartir</button>
        <span id="error" class="error"></span>
    </section>
    <section class="table">
        <div class="status">
            <span>Fase: <strong id="phaseLabel">—</strong></span>
            <span>Bote: <strong id="potLabel">0</strong></span>
            <span>Apuesta: <strong id="betLabel">0</strong></span>
            <span>Turno: <strong id="turnLabel">—</strong></span>
        </div>
        <h2>Comunitarias</h2>
        <div id="community" class="hand"></div>
        <h2>Jugadores</h2>
        <div id="players"></div>
        <div class="lobby">
            <button data-action="fold" disabled>Retirarse</button>
            <button data-action="check" disabled>Pasar</button>
            <button data-action="call" disabled>Igualar</button>
            <input id="raiseInput" type="number" min="1" value="20" />
            <button data-action="raise" disabled>Subir</button>
        </div>
    </section>
    <script src="/socket.io/socket.io.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
